<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>汇盛支付商户端整合 Demo</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #17233b;
      --panel-hover: #223353;
      --line: #334665;
      --text: #f8fafc;
      --muted: #a9b7cd;
      --primary: #4f7fe8;
      --focus: #8db4ff;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .bundle { width: 100%; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .bundle.live-mode,
    .bundle.auth-mode { grid-template-rows: minmax(0, 1fr); }
    .bundle.live-mode .review-header,
    .bundle.auth-mode .review-header { display: none; }
    .review-header {
      min-height: 70px;
      display: grid;
      grid-template-columns: minmax(220px, auto) minmax(0, 1fr) minmax(230px, auto);
      align-items: center;
      gap: 18px;
      padding: 10px 18px;
      color: var(--text);
      background: linear-gradient(100deg, #0b1324, #142440);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 5px 18px rgba(0,0,0,.22);
      z-index: 3;
    }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-mark {
      width: 34px; height: 34px; flex: 0 0 auto;
      display: grid; place-items: center;
      border: 1px solid #5f83c9; border-radius: 8px; color: #a8c6ff;
    }
    .brand b { display: block; font-size: 15px; }
    .brand small { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .module-tabs { display: flex; align-items: center; justify-content: center; gap: 6px; overflow-x: auto; padding: 3px; }
    .module-tab {
      flex: 0 0 auto; min-height: 38px; padding: 7px 13px;
      color: #c1cde0; background: transparent; border: 1px solid transparent; border-radius: 7px;
      transition: color .2s ease, background .2s ease, border-color .2s ease;
    }
    .module-tab:hover { color: #fff; background: var(--panel-hover); }
    .module-tab.active { color: #fff; background: #274d91; border-color: #4f75b9; }
    .review-meta { min-width: 0; text-align: right; }
    .review-meta strong { display: block; color: #e7efff; font-size: 12px; }
    .review-meta span {
      display: block; max-width: 390px; margin-top: 2px; color: var(--muted);
      font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .frame-shell { position: relative; min-height: 0; background: #eef2f7; }
    iframe { width: 100%; height: 100%; display: block; border: 0; background: #fff; }
    .loading {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: #52647d; background: #f3f6fa; z-index: 2;
    }
    .loading[hidden] { display: none; }
    .loading-card { display: flex; align-items: center; gap: 10px; padding: 14px 18px; background: #fff; border: 1px solid #dce4ef; border-radius: 9px; box-shadow: 0 12px 28px rgba(20,35,58,.1); }
    .spinner { width: 18px; height: 18px; border: 2px solid #d8e2f1; border-top-color: #3268ce; border-radius: 50%; animation: spin .75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 900px) {
      .review-header { grid-template-columns: 1fr auto; gap: 8px; }
      .module-tabs { grid-column: 1 / -1; grid-row: 2; justify-content: flex-start; }
      .review-meta span { max-width: 230px; }
    }
    @media (max-width: 560px) {
      .review-header { padding: 9px 11px; }
      .review-meta { display: none; }
      .module-tabs { grid-column: 1 / -1; }
      .module-tab { min-height: 44px; padding: 8px 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

    const frame = document.getElementById("demoFrame");
    const loading = document.getElementById("loading");
    const bundle = document.getElementById("merchantBundle");
    const reviewMode = new URLSearchParams(window.location.search).get("review") === "1";
    bundle.classList.toggle("live-mode", !reviewMode);
    let activeModule = "overview";

    function decodeBase64(value) {
      const binary = atob(value);
      const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
      return new TextDecoder("utf-8").decode(bytes);
    }

    function openModule(moduleId, hash = "") {
      const target = modules[moduleId] || modules["overview"];
      activeModule = modules[moduleId] ? moduleId : "overview";
      loading.hidden = false;
      frame.dataset.initialHash = hash || "";
      frame.title = "汇盛支付商户端 · " + target.label;
      document.getElementById("moduleTitle").textContent = target.label;
      document.getElementById("moduleDescription").textContent = target.description;
      document.querySelectorAll("[data-module]").forEach(button => {
        const active = button.dataset.module === activeModule;
        button.classList.toggle("active", active);
        button.setAttribute("aria-current", active ? "page" : "false");
      });
      frame.srcdoc = decodeBase64(target.html);
    }

    document.querySelectorAll("[data-module]").forEach(button => {
      button.addEventListener("click", () => openModule(button.dataset.module));
    });

    frame.addEventListener("load", () => { loading.hidden = true; });
    window.addEventListener("message", event => {
      const data = event.data;
      if (!data) return;
      if (data.type === "hs-merchant-auth-state") {
        bundle.classList.toggle("auth-mode", !data.authenticated);
        return;
      }
      if (data.type === "hs-demo-open-module") openModule(data.module, data.hash || "");
    });

    openModule(activeModule);
  </script>
